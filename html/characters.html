<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Characters Page</title>
    <link rel="stylesheet" href="../css/main.css" />
    <script src="../js/modal.js" defer></script>
  </head>

  <body>
    <div class="border">
      <h2>A Citizen's Perspective</h2>
      <h3>Click the images to find out more about democracy in these societies!</h3>
    </div>

    <div class="container">
      <div class="chars">
        <button class="modal-btn" data-modal="modal-sg">
          <img class="char-img" src="../images/sg char.png" src="Female Singaporean" />
        </button>
        <div id="modal-sg" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <iframe src="./singapore.html" width="100%" height="100%"></iframe>
          </div>
        </div>
        <p>Singapore, A Civil Servant's Perspective</p>
      </div>
      <div class="chars">
        <button class="modal-btn" data-modal="modal-hk">
          <img class="char-img" src="../images/hk char.png" src="Hong Kong Man" />
        </button>
        <div id="modal-hk" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <iframe src="./hong kong.html" width="100%" height="100%"></iframe>
          </div>
        </div>
        <p>Hong Kong, A (Former) Protestor's Perspective</p>
      </div>
      <div class="chars">
        <button class="modal-btn" data-modal="modal-usa">
          <img class="char-img" src="../images/usa char.png" src="American Man" />
        </button>
        <div id="modal-usa" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <iframe src="./usa.html" width="100%" height="100%"></iframe>
          </div>
        </div>
        <p>USA, A Teacher's Perspective</p>
      </div>
    </div>

    <div class="container-menu">
      <a class="menu-btn" href="./index.html"><span>Not ready? Go back!</span></a>
      <a class="menu-btn" href="./forum.html"><span>Global Forum</span></a>
    </div>
  </body>
</html>
